# Link the C runtime (vcruntime and the Universal CRT) into every Rust executable, so the program
# needs only operating-system DLLs, like the other languages. Applies to every Rust project in the
# repository: Apps/<App>/Rust and Projects/<Project>/Rust.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
